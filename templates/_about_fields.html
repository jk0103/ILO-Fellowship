{# The four "about you" questions, shared by the welcome page and the
   profile. Takes `about` (the stored answers, or {}) and the choices
   app.about_choices() supplies. #}
  <div class="form-row">
    <div>
      <label for="gender">Gender</label>
      <select id="gender" name="gender" required>
        <option value="" disabled{% if not about.get('gender') %} selected{% endif %}>Select&hellip;</option>
        {% for key, label in genders %}
        <option value="{{ key }}"{% if about.get('gender') == key %} selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label for="age">Age</label>
      <input type="number" id="age" name="age" inputmode="numeric"
             min="{{ age_min }}" max="{{ age_max }}" step="1"
             value="{{ about.get('age', '') }}" required>
    </div>
  </div>

  <label for="school">School</label>
  <input type="text" id="school" name="school" maxlength="{{ school_max }}"
         autocomplete="organization" value="{{ about.get('school', '') }}" required>

  <label for="nationality">Nationality</label>
  <select id="nationality" name="nationality" required>
    <option value="" disabled{% if not about.get('nationality') %} selected{% endif %}>Select&hellip;</option>
    {% for country in countries %}
    <option value="{{ country }}"{% if about.get('nationality') == country %} selected{% endif %}>{{ country }}</option>
    {% endfor %}
  </select>
