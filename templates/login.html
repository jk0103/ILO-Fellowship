{% extends "base.html" %}
{% block title %}Log in &middot; ILO Bank{% endblock %}
{% block main_class %}auth-main{% endblock %}

{% block content %}
<div class="auth-card">
  <h1>Welcome back</h1>
  <p class="auth-sub">Log in to continue your practice.</p>

  <div class="auth-error" id="auth-error" hidden></div>
  <div class="auth-note" id="auth-note" hidden></div>

  <button type="button" class="btn btn-google" id="google-btn">
    <svg class="g-logo" viewBox="0 0 48 48" aria-hidden="true">
      <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.2 17.7 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9.1h12.4c-.5 2.9-2.2 5.3-4.7 6.9l7.3 5.6c4.3-3.9 6.8-9.8 6.8-17z"/>
      <path fill="#FBBC05" d="M10.4 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.3.8-4.7l-7.8-6.1C.9 16.3 0 20 0 24s.9 7.7 2.6 10.8l7.8-6.1z"/>
      <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.3-5.6c-2 1.4-4.7 2.3-8.6 2.3-6.3 0-11.7-3.7-13.6-9.2l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/>
    </svg>
    Continue with Google
  </button>

  <div class="divider"><span>or</span></div>

  <form id="login-form" novalidate>
    <label for="email">Email</label>
    <input type="email" id="email" name="email" autocomplete="username" required autofocus>

    <label for="password">Password</label>
    <div class="password-wrap">
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="button" class="toggle-pw" data-target="password" aria-label="Show password">Show</button>
    </div>

    <p class="forgot"><a href="#" id="reset-link">Forgot your password?</a></p>

    <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Log in</button>
  </form>

  <p class="auth-alt">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
